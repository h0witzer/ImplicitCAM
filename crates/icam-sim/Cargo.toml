[package]
name = "icam-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The machined stock and the part as fields on one grid, built once on the GPU, for looking at a program"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard"] }
icam-core = { path = "../icam-core" }
icam-gpu = { path = "../icam-gpu" }
icam-motion = { path = "../icam-motion" }
icam-post = { path = "../icam-post" }
icam-stock = { path = "../icam-stock" }
icam-sweep = { path = "../icam-sweep" }
png = "0.17.16"
pollster = "1.0.1"
rayon = "1.12.0"
wgpu = "30.0.1"
winit = "0.30.13"
