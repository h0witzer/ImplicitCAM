name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Design guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The decisions in CONTRIBUTING.md that a pattern can see (1-6 and 10), checked over
      # every Rust file in crates/ against tools/frep-guard/baseline.json. Decisions 8 (no
      # incumbent toolpath constructions), 9 (GPU first) and 11 (one planner) are about method,
      # which no pattern sees; Claude Code's edit check covers 8 and 11, and review covers all.
      - run: node tools/frep-guard/check.mjs
      # The guard's session-start text and the edit-check prompts are copies of CONTRIBUTING.md.
      - run: node tools/frep-guard/sync-decisions.mjs --check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # The GPU test skips itself on runners without a GPU.
      - run: cargo test --workspace --release --locked
